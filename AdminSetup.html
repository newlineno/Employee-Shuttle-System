<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #26352c;
    }

    .container {
      max-width: 430px;
      margin: 30px auto;
      padding: 26px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 16px rgba(0,0,0,.07);
    }

    h2 { margin-top: 0; text-align: center; }
    .sub { text-align: center; color: #68756c; font-size: 14px; }

    label {
      display: block;
      margin: 17px 0 7px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccd5ce;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: 0;
      border-radius: 8px;
      background: #16834a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    #message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .success { background: #e5f5eb; color: #176b38; }
    .error { background: #fdeaea; color: #a32121; }
  </style>
</head>

<body>
  <div class="container">
    <h2>ตั้งค่าผู้ดูแลระบบ</h2>
    <p class="sub">สร้างบัญชีผู้ดูแลหลักครั้งแรก</p>

    <form id="adminForm">
      <label>รหัสอนุญาตสมัคร</label>
      <input type="password" id="setupKey"
        autocomplete="off" required>

      <label>ชื่อผู้ใช้</label>
      <input type="text" id="username"
        minlength="4" maxlength="30"
        pattern="[A-Za-z0-9_]+"
        autocomplete="username" required>

      <label>ชื่อผู้ดูแล</label>
      <input type="text" id="adminName"
        maxlength="100" required>

      <label>รหัสผ่าน</label>
      <input type="password" id="password"
        minlength="12" maxlength="128"
        autocomplete="new-password" required>

      <label>ยืนยันรหัสผ่าน</label>
      <input type="password" id="confirmPassword"
        minlength="12" maxlength="128"
        autocomplete="new-password" required>

      <button type="submit" id="submitBtn">
        สร้างบัญชีผู้ดูแลหลัก
      </button>
    </form>

    <div id="message" role="status"></div>
  </div>

  <script>
    const form = document.getElementById('adminForm');
    const button = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const setupKey = document.getElementById('setupKey').value.trim();
      const username = document.getElementById('username').value.trim();
      const adminName = document.getElementById('adminName').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showMessage('รหัสผ่านทั้งสองช่องไม่ตรงกัน', false);
        return;
      }

      if (password.length < 12) {
        showMessage('รหัสผ่านต้องมีอย่างน้อย 12 ตัวอักษร', false);
        return;
      }

      button.disabled = true;
      button.textContent = 'กำลังสร้างบัญชี...';
      message.style.display = 'none';

      google.script.run
        .withSuccessHandler(function(result) {
          button.disabled = false;
          button.textContent = 'สร้างบัญชีผู้ดูแลหลัก';

          if (result && result.success) {
            form.reset();
            button.disabled = true;
            showMessage(result.message, true);
          } else {
            showMessage(
              result && result.message
                ? result.message
                : 'ไม่สามารถสร้างบัญชีได้',
              false
            );
          }
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          button.textContent = 'สร้างบัญชีผู้ดูแลหลัก';
          showMessage(error.message || 'เกิดข้อผิดพลาด', false);
        })
        .createFirstAdmin({
          setupKey: setupKey,
          username: username,
          adminName: adminName,
          password: password
        });
    });

    function showMessage(text, success) {
      message.textContent = text;
      message.className = success ? 'success' : 'error';
      message.style.display = 'block';
    }
  </script>
</body>
</html>
